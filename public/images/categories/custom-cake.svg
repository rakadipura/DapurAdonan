<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#FDF6E3"/>
  <!-- Mini 2-tier cake -->
  <ellipse cx="150" cy="190" rx="70" ry="30" fill="#FFF0E0" stroke="#E8C58A" stroke-width="2"/>
  <rect x="80" y="160" width="140" height="60" fill="#FFF0E0"/>
  <ellipse cx="150" cy="160" rx="70" ry="15" fill="#FFF0E0" stroke="#E8C58A" stroke-width="2"/>
  <ellipse cx="150" cy="120" rx="40" ry="25" fill="#FFE0D0" stroke="#E8B57A" stroke-width="2"/>
  <rect x="110" y="95" width="80" height="50" fill="#FFE0D0"/>
  <ellipse cx="150" cy="95" rx="40" ry="10" fill="#FFE0D0" stroke="#E8B57A" stroke-width="2"/>
  <!-- Decoration -->
  <circle cx="150" cy="85" r="6" fill="#FF6B6B"/>
  <ellipse cx="135" cy="95" rx="10" ry="5" fill="#4ECDC4"/>
  <ellipse cx="165" cy="95" rx="10" ry="5" fill="#FFE66D"/>
  <text x="150" y="255" font-family="system-ui, sans-serif" font-size="14" fill="#8B6B4A" text-anchor="middle">Custom Cake</text>
  <text x="150" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#A08060" text-anchor="middle">300x300px</text>
</svg>