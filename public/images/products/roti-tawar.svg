<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#FDF6E3"/>
  <!-- Bread loaf -->
  <path d="M80,300 Q80,150 200,120 Q320,150 320,300 L320,350 L80,350 Z" fill="#E8C58A" stroke="#D4A574" stroke-width="2"/>
  <!-- Bread top crust -->
  <path d="M80,300 Q200,120 320,300" stroke="#C4A06A" stroke-width="3" fill="none"/>
  <!-- Slices -->
  <g stroke="#D4A574" stroke-width="1" opacity="0.5">
    <line x1="130" y1="140" x2="130" y2="350"/>
    <line x1="180" y1="135" x2="180" y2="350"/>
    <line x1="230" y1="130" x2="230" y2="350"/>
    <line x1="280" y1="135" x2="280" y2="350"/>
  </g>
  <text x="200" y="370" font-family="system-ui, sans-serif" font-size="16" fill="#8B6B4A" text-anchor="middle">Roti Tawar</text>
  <text x="200" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#A08060" text-anchor="middle">400x400px</text>
</svg>